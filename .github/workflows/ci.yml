name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Compile
        run: uv run python -m compileall -q cfboundary
      - name: Import smoke
        run: |
          uv run python - <<'PY'
          from cfboundary.ffi import d1_null, js_null, to_js, to_py
          from cfboundary.testing import patch_pyodide_runtime
          with patch_pyodide_runtime():
              assert d1_null() is js_null()
          assert to_py(to_js({"ok": True})) == {"ok": True}
          PY
      - name: Ruff
        run: uv run ruff check .
      - name: Type check
        run: uvx ty check cfboundary tests
      - name: Tests
        run: uv run pytest --cov=cfboundary --cov-branch --cov-report=term-missing --cov-fail-under=100
      # Runs the FFI helpers inside real Pyodide (npm `pyodide`, pinned in tests/pyodide/package.json)
      # to check the JsProxy/jsnull/to_js semantics the CPython fakes cannot model. No credentials,
      # no network after `npm ci`. Cheap and deterministic: about 4 s of steps, so no separate job.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/pyodide/package-lock.json
      - name: Install Pyodide
        run: npm ci --prefix tests/pyodide
      - name: Real Pyodide boundary tests
        run: npm test --prefix tests/pyodide
      - name: Build package
        run: uv build
