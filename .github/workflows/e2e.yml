name: Live E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed cfboundary live Worker URL"
        required: true
        type: string

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Run live E2E tests
        env:
          CFBOUNDARY_E2E_BASE_URL: ${{ inputs.base_url }}
        run: uv run pytest tests/e2e -q
